{% extends "base.html" %}
{% block title %}신청 접수{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>신청이 접수되었습니다</h1>
  <p>관리자가 확인하면 계정을 만들고 임시 비밀번호를 따로 전달합니다. 이미 쓰이고 있는 사용자명이면 관리자가 연락드립니다.</p>
  <p class="muted">처음 로그인할 때 <a href="{{ settings.root_path }}/expired">비밀번호 변경</a> 화면에서 임시 비밀번호를 새 비밀번호로 바꿔 주세요.</p>
</section>
{% endblock %}
