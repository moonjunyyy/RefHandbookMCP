<style>
:root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#667085; --line:#e2e5ea; --accent:#2f5bd3; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#12151b; --card:#1b2029; --text:#e6e9ef; --muted:#98a2b3; --line:#2c3340; --accent:#6b8cff; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text);
       font:15px/1.6 system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; }
main { max-width:880px; margin:0 auto; padding:40px 16px 56px; }
h1 { font-size:1.6rem; margin:0 0 4px; } h2 { font-size:1.05rem; margin:0 0 8px; }
.lead { color:var(--muted); margin:0 0 28px; }
.grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
.card p { margin:0 0 10px; color:var(--muted); font-size:.95em; }
a { color:var(--accent); }
code { font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.88em; overflow-wrap:anywhere; }
.row { display:flex; gap:14px; flex-wrap:wrap; margin-top:4px; }
