# The server's shared layers (`refhandbook layers build`). Each is built once by the
# administrator, as root inside a sandbox over its parents, reaching out only through the egress
# supervisor to the profiles named in `egress`; every download is checked against the checksum its
# publisher lists. What a recipe installs under /usr/local, /opt and /etc becomes a read-only layer
# every user may stack (`sys:<name>`). `env` is what a sandbox stacking it needs ($PATH: what is
# below it; the /work directories go last, so nothing written there shadows a layer's command).

[python]
description = "Python (uv-managed CPython) with uv; packages come from pypi through egress"
egress = ["python-tools", "pypi"]
timeout = 1800
env = { UV_PYTHON = "/usr/local/bin/python3", UV_PYTHON_DOWNLOADS = "never", UV_CACHE_DIR = "/work/.cache/uv", PIP_CACHE_DIR = "/work/.cache/pip", PATH = "$PATH:/work/.local/bin" }

[python-sci]
description = "numpy, scipy, sympy, mpmath, pandas, matplotlib, networkx, scikit-learn, statsmodels, …"
parents = ["python"]
egress = ["pypi"]
timeout = 3600
env = { MPLBACKEND = "Agg", MPLCONFIGDIR = "/work/.cache/matplotlib" }

[node]
description = "Node.js LTS with npm and npx; packages come from npm through egress"
egress = ["nodejs"]
timeout = 1800
env = { NPM_CONFIG_CACHE = "/work/.cache/npm", NPM_CONFIG_PREFIX = "/work/.npm-global", NPM_CONFIG_UPDATE_NOTIFIER = "false", PATH = "$PATH:/work/.npm-global/bin" }

[rust]
description = "Rust stable (rustup, minimal profile): cargo, rustc; crates come through egress"
egress = ["rustup"]
timeout = 3600
env = { RUSTUP_HOME = "/opt/rust/rustup", CARGO_HOME = "/work/.cargo", RUSTUP_TOOLCHAIN = "stable", PATH = "/opt/rust/cargo/bin:$PATH:/work/.cargo/bin" }
