{% extends "base.html" %}
{% block title %}{{ t('가입 완료') }}{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>{{ t('가입했습니다') }}</h1>
  <p>{{ t('{uid} 계정이 만들어졌습니다. 방금 정한 비밀번호로 로그인하세요.', uid=uid) }}</p>
  <p><a class="button" href="{{ settings.login_url if sso else settings.root_path + '/login' }}">{{ t('로그인') }}</a></p>
</section>
{% endblock %}
