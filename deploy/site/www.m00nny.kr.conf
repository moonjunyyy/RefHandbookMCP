# /etc/nginx/sites-available/www.m00nny.kr
# One site, one sign-in:
#   /                 landing page (static, /var/www/m00nny)
#   /auth/            site sign-in (portal/sso.py, :8090): Kerberos, a cookie for browsers
#   /account/         account portal (portal/main.py, :8080, PORTAL_AUTH=sso); /account/request is public
#   /dav/<uid>/       WebDAV on /data/<uid> (nginx dav + dav_ext), Basic with the Kerberos password
#   /mcp, /authorize, /token, /register, /revoke, /login, /.well-known/oauth-*
#                     refhandbook (:8765, RHB_AUTH=sso): its OAuth stays; /login only asks "allow?"
#   /api/             reserved: protect it like /account/ (its own audience) when something lives there
#
# Every protected location asks /_auth (the SSO's /auth/check). Backends get X-Auth-Token, a
# one-minute EdDSA token for them alone, and trust nothing else. Needs snippets/m00nny-proxy.conf.

limit_req_zone $binary_remote_addr zone=m00nny_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=m00nny_oauth:10m rate=30r/m;
dav_ext_lock_zone zone=m00nny_dav:10m;

# Which backend a token is minted for. $request_uri, not $uri: the map is read inside the auth
# subrequest, where $uri is /_auth.
map $request_uri $auth_audience {
    default             "";
    ~^/account(/|\?|$)  account;
    ~^/login(\?|$)      refhandbook;
}

server {
    listen 80;
    server_name www.m00nny.kr m00nny.kr;
    return 301 https://www.m00nny.kr$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.m00nny.kr;
    ssl_certificate     /etc/letsencrypt/live/www.m00nny.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.m00nny.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/m00nny;
    client_max_body_size 4m;

    location = / { try_files /index.html =404; }

    # ── the sign-in check (internal) ─────────────────────────────────────
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8090/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Destination $http_destination;   # WebDAV MOVE/COPY target
        proxy_set_header X-Auth-Audience $auth_audience;
        # Cookie and Authorization go along with the original request's headers.
    }
    location @signin { return 302 /auth/login?next=$request_uri; }

    # ── site sign-in ─────────────────────────────────────────────────────
    location /auth/ {
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8090;
    }
    location ~ ^/auth/(login|expired)$ {
        limit_req zone=m00nny_login burst=5 nodelay;
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8090;
    }
    location = /auth/check { return 404; }   # nginx's alone, through /_auth

    # ── account portal ───────────────────────────────────────────────────
    location = /account { return 301 /account/; }
    location /account/ {
        auth_request /_auth;
        auth_request_set $auth_token $upstream_http_x_auth_token;
        error_page 401 = @signin;
        include snippets/m00nny-proxy.conf;
        proxy_set_header X-Auth-Token $auth_token;
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 16k;
    }
    # Optional: the admin console from the LAN only.
    # location /account/admin/ { allow 192.168.0.0/16; deny all; auth_request /_auth;
    #     auth_request_set $auth_token $upstream_http_x_auth_token; error_page 401 = @signin;
    #     include snippets/m00nny-proxy.conf; proxy_set_header X-Auth-Token $auth_token;
    #     proxy_pass http://127.0.0.1:8080; }
    location = /account/request {            # 사용 신청: no account yet, by definition
        limit_req zone=m00nny_login burst=5 nodelay;
        include snippets/m00nny-proxy.conf;
        proxy_set_header X-Auth-Token "";
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 16k;
    }
    location /account/static/ {
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8080;
    }

    # ── WebDAV: /dav/<uid>/ is /data/<uid>/ ──────────────────────────────
    # The SSO admits only the signed-in user's own /dav/<uid>/ (path and Destination). Files belong
    # to www-data; /data/<uid> must exist (deploy/site/dav-homes.sh makes them).
    location /dav/ {
        auth_request /_auth;
        alias /data/;
        dav_methods PUT DELETE MKCOL COPY MOVE;
        dav_ext_methods PROPFIND OPTIONS LOCK UNLOCK;
        dav_ext_lock zone=m00nny_dav;
        dav_access user:rw;
        create_full_put_path on;
        client_max_body_size 0;
        client_body_temp_path /data/.upload;   # same filesystem: uploads are moved, not copied
        autoindex off;
    }

    # ── refhandbook (MCP + its OAuth) ────────────────────────────────────
    location = /login {                      # consent after the site sign-in
        auth_request /_auth;
        auth_request_set $auth_token $upstream_http_x_auth_token;
        error_page 401 = @signin;
        limit_req zone=m00nny_login burst=5 nodelay;
        include snippets/m00nny-proxy.conf;
        proxy_set_header X-Auth-Token $auth_token;
        proxy_pass http://127.0.0.1:8765;
    }
    location ~ ^/(register|authorize|token|revoke)$ {
        limit_req zone=m00nny_oauth burst=20 nodelay;
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location ^~ /.well-known/oauth- {
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
    }
    location /mcp {
        include snippets/m00nny-proxy.conf;
        proxy_pass http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
