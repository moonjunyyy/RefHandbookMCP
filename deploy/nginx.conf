# /etc/nginx/sites-available/refhandbook  (TLS from certbot: certbot --nginx -d hb.example.org)
# Sites files are included inside http{}, so the zones can be declared here.
limit_req_zone $binary_remote_addr zone=rhb_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rhb_oauth:10m rate=30r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name hb.example.org;

    ssl_certificate     /etc/letsencrypt/live/hb.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hb.example.org/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # keeps a router's header and appends
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    # Sign-in and registration are unauthenticated: rate-limit them per address.
    location = /login     { limit_req zone=rhb_login burst=5 nodelay;  proxy_pass http://127.0.0.1:8765; }
    location = /register  { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /authorize { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /token     { limit_req zone=rhb_oauth burst=20 nodelay; proxy_pass http://127.0.0.1:8765; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        # Streamable HTTP answers with server-sent events: pass them through unbuffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}

server {
    listen 80;
    server_name hb.example.org;
    return 301 https://$host$request_uri;
}
