# Either: the portal on its own host (PORTAL_ROOT_PATH= empty) ...
server {
    listen 80;
    server_name portal.m00nny.kr;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    http2 on;
    server_name portal.m00nny.kr;
    ssl_certificate     /etc/ssl/portal/fullchain.pem;
    ssl_certificate_key /etc/ssl/portal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    # Optional: only allow the console from your internal networks.
    # location /admin/ { allow 10.0.0.0/8; deny all; proxy_pass http://127.0.0.1:8080; include proxy_params; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

