# @@generated@@
# The router's side, for its admin to merge into the TLS-terminating nginx in front of this host.
# Fill in the certificate and <this host> (this host's address as the router reaches it).
server {
    listen 443 ssl;
    server_name @@domain@@@@aliases_sp@@;
    ssl_certificate     <the certificate's fullchain.pem>;
    ssl_certificate_key <its privkey.pem>;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4m;   # the site's own limit (nginx's default is 1m)

    location / {
        proxy_pass http://<this host>:@@port@@;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;                 # the site's server_name, and the alias redirect
        proxy_set_header X-Forwarded-For $remote_addr;   # the client: the site's limits and audit log
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;                         # /mcp streams its answers
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
