# @@generated@@
# One site, one sign-in. Only the core is here: TLS (or the router's), the landing page, the sign-in
# check and /auth/.
# Every service is an [[app]] of @@site_file@@, rendered into the two @@name@@-apps snippets.
include snippets/@@name@@-apps-map.conf;
@@front@@
server {
@@listen@@
    server_name @@domain@@;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root @@webroot@@;
    client_max_body_size 4m;

    location = / { try_files /index.html =404; }

    # ── the sign-in check (internal) ─────────────────────────────────────
    location = /_auth {
        internal;
        proxy_pass @@upstream:sso@@/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Auth-Audience $auth_audience;
    }
    location @signin { return 302 /auth/login?next=$request_uri; }

    # ── site sign-in ─────────────────────────────────────────────────────
    location /auth/ {
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location ~ ^/auth/(login|expired)$ {
        limit_req zone=@@name@@_login burst=5 nodelay;
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location = /auth/check { return 404; }   # nginx's alone, through /_auth

    include snippets/@@name@@-apps.conf;
}
