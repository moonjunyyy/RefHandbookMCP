# @@generated@@
# One site, one sign-in. Only the core is here: TLS, the landing page, the sign-in check and /auth/.
# Every service is an [[app]] of @@site_file@@, rendered into the two @@name@@-apps snippets.
include snippets/@@name@@-apps-map.conf;
dav_ext_lock_zone zone=@@name@@_dav:10m;

server {
    listen 80;
    server_name @@domain@@@@aliases_sp@@;
    return 301 https://@@domain@@$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name @@domain@@;
    ssl_certificate     /etc/letsencrypt/live/@@domain@@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@@domain@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root @@webroot@@;
    client_max_body_size 4m;

    location = / { try_files /index.html =404; }

    # ── the sign-in check (internal) ─────────────────────────────────────
    location = /_auth {
        internal;
        proxy_pass @@upstream:sso@@/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Destination $http_destination;   # WebDAV MOVE/COPY target
        proxy_set_header X-Auth-Audience $auth_audience;
    }
    location @signin { return 302 /auth/login?next=$request_uri; }

    # ── site sign-in ─────────────────────────────────────────────────────
    location /auth/ {
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location ~ ^/auth/(login|expired)$ {
        limit_req zone=@@name@@_login burst=5 nodelay;
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location = /auth/check { return 404; }   # nginx's alone, through /_auth

    include snippets/@@name@@-apps.conf;
}
