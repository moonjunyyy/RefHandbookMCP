# @@generated@@
# One site, one sign-in. Only the core is here: TLS (or the router's), the main page, the sign-in
# check and @@signin@@/.
# Every service is an [[app]] of @@site_file@@, rendered into the two @@name@@-apps snippets.
include snippets/@@name@@-apps-map.conf;
@@front@@
server {
@@listen@@
    server_name @@domain@@;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # nginx's own redirects (a trailing slash, the sign-in) are relative: an absolute one would name
    # this server's scheme and port (plain HTTP on the listen port, behind a router), not the client's
    absolute_redirect off;

    client_max_body_size 4m;

    location = / {   # the main page: the SSO's, so it knows who is signed in
        include snippets/@@name@@-proxy.conf;
        proxy_set_header X-Auth-Token "";
        proxy_pass @@upstream:sso@@;
    }

    # ── the sign-in check (internal) ─────────────────────────────────────
    location = /_auth {
        internal;
        proxy_pass @@upstream:sso@@@@signin@@/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Auth-Audience $auth_audience;
    }
    location @signin { return 302 @@signin@@/login?next=$request_uri; }

    # ── site sign-in ─────────────────────────────────────────────────────
    location @@signin@@/ {
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location ~ ^@@signin@@/(login|expired)$ {
        limit_req zone=@@name@@_login burst=5 nodelay;
        include snippets/@@name@@-proxy.conf;
        proxy_pass @@upstream:sso@@;
    }
    location = @@signin@@/check { return 404; }   # nginx's alone, through /_auth

    include snippets/@@name@@-apps.conf;
}
