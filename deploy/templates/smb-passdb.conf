# @@generated@@
# Samba's accounts from the directory (docs/smb.md). Merge these lines into [global] of smb.conf on the
# Samba host, in place of its own `passdb backend`, after the steps in samba.ldif beside this file; then
#   smbpasswd -w "$SECRET"        the Samba DN's password, as set there (Samba keeps it in secrets.tdb)
#   testparm -s && systemctl restart smbd
# Samba reads each account's NT hash from its entry and cannot write it: the site writes it whenever it
# sets a password (smb_passwords = "1" in [site] of the site file).
passdb backend = ldapsam:@@samba_ldap_uri@@
ldap suffix = @@base_dn@@
ldap user suffix = @@users_rdn@@
ldap group suffix = @@groups_rdn@@
ldap admin dn = @@samba_dn@@
# ldapi is a local socket (no TLS on it); for an ldaps:// URI the URI itself says TLS
ldap ssl = off
# Kerberos keeps the password; Samba never writes userPassword, and leaves an entry when an account goes
ldap passwd sync = no
ldap delete dn = no
# its domain entry in the directory is named after it (samba.ldif)
workgroup = @@workgroup@@
