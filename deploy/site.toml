  [[app.route]]
  path = "/board/api/"
  limit = "api"
  burst = 40
  body = "64k"
  signin = false
  note = "the board's JSON API (refhandbook/board_api.py): a 401 is answered as JSON, not sent to the sign-in page"

[[app]]
id = "refhandbook"
title = "핸드북"
icon = "📘"
description = "Claude 에 붙이는 연구 카드와 원장"
about = "Claude 에 커스텀 커넥터로 더하면, 이 사이트에 로그인한 뒤 허용 화면이 나옵니다. 연구 카드·원장·샌드박스를 Claude 가 씁니다."
tags = ["AI", "연구"]
tr.en = { title = "Handbook", description = "Research cards and ledgers, plugged into Claude", about = "Add it to Claude as a custom connector: after signing in to this site you are asked to allow it. Claude then works with the cards, the research ledgers and the sandbox." }
code = "https://@@domain@@/mcp"
audience = "refhandbook"
upstream = "@@upstream:handbook@@"
  [[app.route]]
  path = "/login"
  match = "exact"
  limit = "login"
  burst = 5
  note = "consent after the site sign-in"
  [[app.route]]
  path = "^/(register|authorize|token|revoke)$"
  match = "regex"
  auth = "public"
  limit = "oauth"
  burst = 20
  [[app.route]]
  path = "/.well-known/oauth-"
  match = "priority"
  auth = "public"
  [[app.route]]
  path = "/mcp"
  auth = "public"
  stream = true
  note = "its own OAuth bearer tokens"
