# The site, declared once. `sudo deploy/install.sh` installs it as /etc/<name>/site.toml and renders
# everything else from it: the systemd units and the nginx site; the SSO's main page, its audiences
# and the portal's menu read it too.
#
# [site] is optional, every key of it: each value derives from the Kerberos realm (krb5.conf's
# default_realm) unless set here (portal/facts.py lists the derivations):
#   realm = "M00NNY.KR"              name = "m00nny"               domain = "www.m00nny.kr"
#   base_dn = "dc=m00nny,dc=kr"      users_ou = "ou=Users,<base_dn>"   groups_ou = "ou=Groups,<base_dn>"
#   ldap_uri = "ldaps://ldap.m00nny.kr"   aliases = ["m00nny.kr"]   code = "/opt/m00nny-portal"
#   ports = { <role> = <port> }        (the roles and their default ports: portal/facts.py ROLES)
# TLS: nginx holds the certificate (/etc/letsencrypt/live/<domain>) unless `router` names the
# TLS-terminating proxy in front (an IP or CIDR, or a list): then nginx serves plain HTTP on
# `listen` (80) to it alone, takes the client from its X-Forwarded-For, and the installer renders
# the router's side into /etc/<name>/router/<domain>.conf; router_address (this host's address as the
# router reaches it), router_cert and router_key (the certificate's paths on the router) fill it in.
# Keys only this host should know (`router`, say) go in [site] of site.local.toml beside this file:
# it is not in the repository, its keys win over these, and it is installed beside this one.
# Services are named <name>-<role> (m00nny-portal, m00nny-sso): the unit, its
# user, /etc/<unit>, /var/lib/<unit>, /var/log/<unit>.
#
# Strings may use @@placeholders@@: a fact (@@domain@@), a role's unit or upstream
# (@@unit:sso@@, @@upstream:portal@@), or a key of [site].
#
# [[app]]: one per service the sign-in fronts. Route fields: path, match (prefix | exact | regex |
# priority = ^~), auth (site: through the sign-in, with a token if the app has an audience | public:
# no sign-in, any token cleared), upstream (else the app's), limit (login | oauth) and burst, body
# (client_max_body_size), stream (unbuffered, long timeouts), signin (false: pass a 401 through, for
# clients that answer it), nginx (raw directives), note. App fields: id, title,
# description, audience, upstream, groups (who sees it in the menu; the backend enforces its own
# access), menu, menu_href, code (an address on the card), card, icon (an emoji or a letter or two on its
# card and in the app list), tr (the app's words in another language: tr.en = { title, description, menu }),
# [[app.link]] (label, href, groups: shown only to their members, tr: { en = "label" }), [[app.route]].
# Every app with a card shows on the main page and in the app list (/apps) to whoever may see it; each
# person orders them, hides some and picks a start page in their settings (/settings).
#
# An app the site hosts needs no routes: `static = true` serves its built files at /apps/<id>/
# (publish them with `sudo deploy/install.sh --app <id> <dist>`), and `storage = true` gives each
# user a JSON store at /apps/<id>/api/ (portal/apps.py). Both go through the sign-in.

[site]
aliases = ["m00nny.kr"]
portal_root = "/account"

[[app]]
id = "site"
title = "사이트 화면"
description = "The site's pages (web/): the main page, the app list, the settings, the account pages and the agents' pages, over the services' APIs."
static = true
public = true
storage = true  # each person's settings (language, start page, the main page's apps)
card = false
build = "web/dist"
pages = ["/", "/apps", "/settings", "@@portal_root@@/", "/agents/"]
  [[app.route]]
  path = "/agents"
  match = "exact"
  auth = "public"
  nginx = "return 301 /agents/$is_args$args;"

[[app]]
id = "account"
title = "계정"
icon = "👤"
description = "프로필과 비밀번호. 관리자는 여기서 사용자, 사용 신청, 초대 링크를 관리합니다."
tr.en = { title = "Account", description = "Your profile and password. Admins manage users, account requests and invitation links here." }
audience = "account"
upstream = "@@upstream:portal@@"
link = [{ label = "내 계정", href = "@@portal_root@@/", tr = { en = "My account" } },
        { label = "사용자 관리", href = "@@portal_root@@/admin/users", groups = ["@@admin_group@@", "@@helpdesk_group@@"], tr = { en = "Users" } },
        { label = "사용 신청", href = "@@portal_root@@/admin/requests", groups = ["@@admin_group@@"], tr = { en = "Account requests" } },
        { label = "초대 링크", href = "@@portal_root@@/admin/invites", groups = ["@@admin_group@@"], tr = { en = "Invitation links" } }]
  [[app.route]]
  path = "@@portal_root@@"
  match = "exact"
  auth = "public"
  nginx = "return 301 @@portal_root@@/$is_args$args;"
  [[app.route]]
  path = "@@portal_root@@/"
  body = "16k"
  note = "the portal's own pages, until the site's pages app is published (then it answers this path)"
  [[app.route]]
  path = "@@portal_root@@/api/"
  limit = "api"
  burst = 40
  body = "64k"
  signin = false
  note = "the portal's JSON API: a 401 is answered as JSON, not sent to the sign-in page"
  [[app.route]]
  path = "@@portal_root@@/request"
  match = "exact"
  auth = "public"
  limit = "login"
  burst = 5
  body = "16k"
  note = "사용 신청: no account yet, by definition"
  [[app.route]]
  path = "@@portal_root@@/join/"
  auth = "public"
  limit = "login"
  burst = 5
  body = "16k"
  note = "sign-up with an invitation link: no account yet, by definition"
  [[app.route]]
  path = "@@portal_root@@/static/"
  auth = "public"

[[app]]
id = "wordgen"
title = "글타래"
icon = "✍️"
description = "소설 창작용 무작위 키워드 생성기와 집필 메모. 저장한 키워드 세트와 메모는 계정에 남습니다."
tr.en = { title = "Geultarae", description = "A random keyword generator and writing notes for fiction. Saved keyword sets and notes stay with your account." }
static = true
storage = true

[[app]]
id = "agents"
title = "에이전트 · 샌드박스"
icon = "🤖"
description = "본인 API 키(Claude·OpenAI·Gemini·호환 서버)로 에이전트 팀 실행, 모델이 제안한 규칙의 승인·거절, 샌드박스 정책(쓸 수 있는 명령·네트워크·한도), 스크립트와 작업 현황."
tr.en = { title = "Agents · Sandbox", menu = "Agents", description = "Run agent teams with your own API keys (Claude, OpenAI, Gemini, compatible servers), approve or reject rules the model proposes, sandbox policies (commands, network, limits), scripts and jobs." }
audience = "refhandbook"
upstream = "@@upstream:handbook@@"
menu = "에이전트"
menu_href = "/agents/"
link = [{ label = "에이전트 실행", href = "/agents/", tr = { en = "Runs" } }, { label = "프리셋", href = "/agents/presets", tr = { en = "Presets" } },
        { label = "승인", href = "/approvals", tr = { en = "Approvals" } }, { label = "API 키", href = "/agents/keys", tr = { en = "API keys" } }]
  [[app.route]]
  path = "/approvals"
  limit = "oauth"
  burst = 20
  body = "64k"
  note = "the approvals: server-rendered, no script (the user's channel: rules, grants, policies, runs)"
  [[app.route]]
  path = "/agents/"
  limit = "oauth"
  burst = 20
  note = "until the site's pages app is published: the handbook points to the approvals"
  [[app.route]]
  path = "/agents/api/"
  limit = "api"
  burst = 40
  body = "1m"
  signin = false
  note = "the agents' JSON API: a 401 is answered as JSON, not sent to the sign-in page"

[[app]]
id = "refhandbook"
title = "핸드북 (Claude MCP)"
icon = "📘"
description = "Claude에서 커스텀 커넥터로 추가하고 Connect를 누르면, 이 사이트 로그인 후 허용 화면이 나옵니다."
tr.en = { title = "Handbook (Claude MCP)", description = "Add it in Claude as a custom connector and press Connect: after signing in to this site you are asked to allow it." }
code = "https://@@domain@@/mcp"
audience = "refhandbook"
upstream = "@@upstream:handbook@@"
  [[app.route]]
  path = "/login"
  match = "exact"
  limit = "login"
  burst = 5
  note = "consent after the site sign-in"
  [[app.route]]
  path = "^/(register|authorize|token|revoke)$"
  match = "regex"
  auth = "public"
  limit = "oauth"
  burst = 20
  [[app.route]]
  path = "/.well-known/oauth-"
  match = "priority"
  auth = "public"
  [[app.route]]
  path = "/mcp"
  auth = "public"
  stream = true
  note = "its own OAuth bearer tokens"
