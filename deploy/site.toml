# The site, declared once. `sudo deploy/install.sh` installs it as /etc/<name>/site.toml and renders
# everything else from it: the systemd units and the nginx site; the SSO's main page, its audiences
# and the portal's menu read it too.
#
# [site] is optional, every key of it: each value derives from the Kerberos realm (krb5.conf's
# default_realm) unless set here (portal/facts.py lists the derivations):
#   realm = "M00NNY.KR"              name = "m00nny"               domain = "www.m00nny.kr"
#   base_dn = "dc=m00nny,dc=kr"      users_ou = "ou=Users,<base_dn>"   groups_ou = "ou=Groups,<base_dn>"
#   ldap_uri = "ldaps://ldap.m00nny.kr"   aliases = ["m00nny.kr"]   code = "/opt/m00nny-portal"
#   ports = { <role> = <port> }        (the roles and their default ports: portal/facts.py ROLES)
# TLS: nginx holds the certificate (/etc/letsencrypt/live/<domain>) unless `router` names the
# TLS-terminating proxy in front (an IP or CIDR, or a list): then nginx serves plain HTTP on
# `listen` (80) to it alone, takes the client from its X-Forwarded-For, and the installer renders
# the router's side into /etc/<name>/router/<domain>.conf; router_address (this host's address as the
# router reaches it), router_cert and router_key (the certificate's paths on the router) fill it in.
# Keys only this host should know (`router`, say) go in [site] of site.local.toml beside this file:
# it is not in the repository, its keys win over these, and it is installed beside this one.
# Services are named <name>-<role> (m00nny-portal, m00nny-sso): the unit, its
# user, /etc/<unit>, /var/lib/<unit>, /var/log/<unit>.
#
# Strings may use @@placeholders@@: a fact (@@domain@@), a role's unit or upstream
# (@@unit:sso@@, @@upstream:portal@@), or a key of [site].
#
# [[app]]: one per service the sign-in fronts. Route fields: path, match (prefix | exact | regex |
# priority = ^~), auth (site: through the sign-in, with a token if the app has an audience | public:
# no sign-in, any token cleared), upstream (else the app's), limit (login | oauth) and burst, body
# (client_max_body_size), stream (unbuffered, long timeouts), signin (false: pass a 401 through, for
# clients that answer it), nginx (raw directives), note. App fields: id, title,
# description, audience, upstream, groups (who sees it in the menu; the backend enforces its own
# access), menu, menu_href, code (the ways to connect, on its page: a string, or a list of { value, label,
# tr = { en = "label" } }, one per client — a value may name the person looking as {user}), card, icon (an emoji or a letter or two on its
# card and in the app list), about (two or three sentences for its page in the catalog; description is its
# one-line tagline), tags (from portal/site.py TAGS, for the catalog's chips), tr (the app's words in
# another language: tr.en = { title, description, about, menu }),
# [[app.link]] (label, href, groups: shown only to their members, tr: { en = "label" }), [[app.route]].
# Every app with a card is in the catalog (/apps) for whoever may see it; nothing is on until a person
# turns it on there (docs/frame.md §2–§3), and what they turn on is in their header and on their main page
# (its widgets: [[app.widget]], docs/frame.md §4). `optional = false` keeps an app out of the catalog and in
# the person's own menu (the account); `default = true` has an optional app on for an account with no settings
# kept yet (docs/frame.md §2). A widget: id, title, description (one line, for the person choosing it),
# module, size (one of portal/site.py SIZES: 1x1 | 2x1 | 1x2 | 2x2 — the person may resize a placed one),
# tr.en = { title, description }. Its settings, which a person keeps with each place they give the widget:
# [[app.widget.param]] — id, label, and either default with choices = [{ value, label }] or
# from = { path, list, value, label } (the person's own objects, read from a path of the site) with all (the
# word for no filter); tr.en = { label, all, choices = { value = label } }.
#
# An app the site hosts needs no routes: `static = true` serves its built files at /apps/<id>/
# (publish them with `sudo deploy/install.sh --app <id> <dist>`), and `storage = true` gives each
# user a JSON store at /apps/<id>/api/ (portal/apps.py). Both go through the sign-in.

[site]
aliases = ["m00nny.kr"]
portal_root = "/account"
smb_passwords = "1"

