[[app]]
id = "site"
title = "사이트 화면"
description = "The site's pages (web/): the main page, the catalog, the settings, the account pages, the agents' pages, the calendar and the notes, over the services' APIs."
static = true
public = true
storage = true  # each person's settings (language, theme, start page, the apps they turned on, their main page)
card = false
build = "web/dist"
pages = ["/", "/apps", "/app/", "/settings", "/projects", "/projects/", "@@portal_root@@/", "/agents/", "/calendar", "/vault", "/vault/"]
  [[app.route]]
  path = "/agents"
  match = "exact"
  auth = "public"
  nginx = "return 301 /agents/$is_args$args;"

[[app]]
id = "account"
title = "계정"
icon = "👤"
optional = false  # the account is not an app a person turns on: it lives in their own menu
description = "내 프로필과 비밀번호"
about = "프로필과 비밀번호를 고칩니다. 관리자는 사용자, 사용 신청, 초대 링크를 여기서 봅니다."
tr.en = { title = "Account", description = "My profile and password", about = "Change your profile and password. Admins see users, account requests and invitation links here." }
audience = "account"
upstream = "@@upstream:portal@@"
link = [{ label = "내 계정", href = "@@portal_root@@/", tr = { en = "My account" } },
        { label = "사용자 관리", href = "@@portal_root@@/admin/users", groups = ["@@admin_group@@", "@@helpdesk_group@@"], tr = { en = "Users" } },
        { label = "사용 신청", href = "@@portal_root@@/admin/requests", groups = ["@@admin_group@@"], tr = { en = "Account requests" } },
        { label = "초대 링크", href = "@@portal_root@@/admin/invites", groups = ["@@admin_group@@"], tr = { en = "Invitation links" } }]
  [[app.route]]
  path = "@@portal_root@@"
  match = "exact"
  auth = "public"
  nginx = "return 301 @@portal_root@@/$is_args$args;"
  [[app.route]]
  path = "@@portal_root@@/"
  body = "16k"
  note = "the portal's own pages, until the site's pages app is published (then it answers this path)"
  [[app.route]]
  path = "@@portal_root@@/api/"
  limit = "api"
  burst = 40
  body = "64k"
  signin = false
  note = "the portal's JSON API: a 401 is answered as JSON, not sent to the sign-in page"
  [[app.route]]
  path = "@@portal_root@@/request"
  match = "exact"
  auth = "public"
  limit = "login"
  burst = 5
  body = "16k"
  note = "사용 신청: no account yet, by definition"
  [[app.route]]
  path = "@@portal_root@@/join/"
  auth = "public"
  limit = "login"
  burst = 5
  body = "16k"
  note = "sign-up with an invitation link: no account yet, by definition"
  [[app.route]]
  path = "@@portal_root@@/static/"
  auth = "public"

[[app]]
id = "projects"
default = true
title = "프로젝트"
icon = "🧩"
description = "함께 쓰는 그룹 — 저장소·캘린더·볼트의 주인"
about = "프로젝트는 사람들이 직접 만드는 그룹입니다. 구성원은 그 저장소를 함께 쓰고, 프로젝트의 캘린더와 볼트가 거기에 붙습니다. 페이지와 API 는 계정 서비스의 것입니다."
tags = ["자료"]
tr.en = { title = "Projects", description = "Groups you make together, with their own storage", about = "A project is a group people make themselves. Its members share its storage, and the project's calendar and vault belong to it. The pages and the API are the account service's." }
menu_href = "/projects"
link = [{ label = "프로젝트", href = "/projects", tr = { en = "Projects" } }]
  [[app.widget]]
  id = "mine"
  title = "내 프로젝트"
  description = "내가 속한 프로젝트와 그 저장소로 가는 링크"
  module = "/apps/site/widgets/projects.js"
  tr.en = { title = "My projects", description = "The projects you belong to, with a link to each" }

[[app]]
id = "calendar"
default = true
title = "캘린더"
icon = "📅"
description = "내 일정과 프로젝트 일정을 한 달력에"
about = "내 캘린더와 프로젝트마다 하나씩인 캘린더를 한 달력에 겹쳐 봅니다. 구독 주소를 만들어 폰의 캘린더에 넣을 수 있습니다."
tags = ["일정"]
tr.en = { title = "Calendar", description = "Your events and your projects' on one calendar", about = "Your own calendar and one for each of your projects, on one page. Make a subscription address and add it to the calendar on your phone." }
audience = "calendar"
upstream = "@@upstream:calendar@@"
menu_href = "/calendar"
link = [{ label = "캘린더", href = "/calendar", tr = { en = "Calendar" } }]
  [[app.widget]]
  id = "today"
  title = "오늘"
  description = "오늘의 일정과 마감인 할 일 — 넓은 칸"
  module = "/apps/site/widgets/calendar.js"
  size = "2x1"
  tr.en = { title = "Today", description = "Today's events and the tasks due today — a wide cell" }
  [[app.widget]]
  id = "upcoming"
  title = "다가오는 일"
  description = "앞으로 일주일의 일정, 날짜순"
  module = "/apps/site/widgets/calendar.js"
  tr.en = { title = "Coming up", description = "The next seven days' events, in order" }
  [[app.widget]]
  id = "tasks"
  title = "할 일"
  description = "체크리스트 — 홈에서 바로 적고, 끝나면 체크"
  module = "/apps/site/widgets/calendar.js"
  tr.en = { title = "Tasks", description = "A checklist — write it on the main page, tick it when done" }
  [[app.route]]
  path = "/calendar/api/"
  limit = "api"
  burst = 40
  body = "64k"
  signin = false
  note = "the calendars' JSON API (portal/calendar.py): a 401 is answered as JSON, not sent to the sign-in page"
  [[app.route]]
  path = "/calendar/feed/"
  auth = "public"
  limit = "api"
  burst = 20
  note = "the ICS subscription feeds: the address is the key, for a phone's calendar"
  [[app.route]]
  path = "/calendar/dav/"
  auth = "public"
  signin = false
  limit = "api"
  burst = 40
  body = "2m"
  note = "CalDAV (RFC 4791 subset, portal/calendar.py): a phone's or a desktop's calendar app reads and writes with a device password (Basic); the service answers its own 401"
  [[app.route]]
  path = "/.well-known/caldav"
  match = "exact"
  auth = "public"
  nginx = "return 301 /calendar/dav/;"
  note = "CalDAV discovery (RFC 6764): a client given only the host finds the service here"

[[app]]
id = "vault"
default = true
title = "노트"
icon = "📝"
description = "Obsidian 볼트를 브라우저에서"
about = "내 저장소의 마크다운 볼트를 읽고 고칩니다 — Obsidian 이 여는 그 파일 그대로. 검색, 백링크, 최근 노트."
tags = ["글쓰기", "연구"]
tr.en = { title = "Notes", description = "Your Obsidian vault, in the browser", about = "Read and change the markdown vaults of your storage — the very files Obsidian opens. Search, backlinks, recent notes." }
audience = "vault"
upstream = "@@upstream:vault@@"
menu_href = "/vault"
link = [{ label = "노트", href = "/vault", tr = { en = "Notes" } }]
  [[app.widget]]
  id = "recent"
  title = "최근 노트"
  description = "최근에 고친 노트 다섯"
  module = "/apps/site/widgets/vault.js"
  tr.en = { title = "Recent notes", description = "The five notes changed most recently" }
  [[app.widget]]
  id = "home"
  title = "Home"
  description = "볼트의 Home 노트를 그대로 — 큰 칸"
  module = "/apps/site/widgets/vault.js"
  tr.en = { description = "The vault's Home note as it is — a big cell" }
  size = "2x2"
  [[app.route]]
  path = "/vault/api/"
  limit = "api"
  burst = 60
  body = "5m"
  signin = false
  note = "the vaults' JSON API (portal/vault.py): notes up to 4 MB; a 401 is answered as JSON"

[[app]]
id = "eq-sandbox"
title = "수식 플립플롭"
icon = "🧮"
description = "식의 꼴을 손으로 바꾸고 같은 꼴을 모으는 작업판"
about = "식의 부분을 끌어 옮기고, 같다고 주장한 꼴을 무브로 잇고, 서명하거나 증명보조기에 물어 근거를 올립니다. 작업판은 계정에 남고, 홈의 위젯이 최근 작업판을 보여 줍니다."
tags = ["연구", "도구"]
tr.en = { title = "Equation Flip-Flop", description = "Reshape equations by hand, gather equal forms", about = "Drag parts of an expression, connect the forms you claim equal by moves, and raise the grounds by signing or asking the prover. Boards stay with your account; a widget on the main page shows the recent ones." }
static = true
storage = true
  [[app.widget]]
  id = "boards"
  title = "최근 작업판"
  description = "최근에 연 작업판으로 바로"
  module = "widget.js"
  tr.en = { title = "Recent boards", description = "Straight to the boards you opened last" }

[[app]]
id = "wordgen"
title = "글타래"
icon = "✍️"
description = "소설을 위한 키워드와 집필 메모"
about = "무작위 키워드로 이야기를 틔우고, 떠오른 메모를 적어 둡니다. 키워드 세트와 메모는 계정에 남습니다."
tags = ["글쓰기"]
tr.en = { title = "Geultarae", description = "Keywords and writing notes for fiction", about = "Spark a story with random keywords and keep the notes that come. Keyword sets and notes stay with your account." }
static = true
storage = true

[[app]]
id = "smb"
title = "SMB 저장소"
icon = "🗄️"
description = "내 저장소를 탐색기나 Finder 에 붙이는 주소"
about = "내 저장소는 SMB 로 열립니다. 이 서버의 SMB 포트는 표준(445)이 아닌 38445 라서, Windows 에서는 먼저 아래 명령으로 한 번 연결한 뒤 탐색기 주소를 엽니다(Windows 11 24H2 이상). macOS·Linux 는 smb:// 주소를 Finder 의 '서버에 연결'이나 파일 관리자에 그대로 넣습니다."
tags = ["자료"]
tr.en = { title = "SMB Storage", description = "Attach your storage in Explorer or Finder", about = "Your storage opens over SMB on port 38445, not the usual 445. On Windows (11 24H2 or later), connect once with the command, then open the Explorer address. On macOS and Linux, open the smb:// address in Finder or your file manager." }
code = [
  { label = "Windows — 한 번 연결(명령 프롬프트)", value = "net use \\\\samba.m00nny.kr\\{user} /TCPPORT:38445", tr = { en = "Windows — connect once (Command Prompt)" } },
  { label = "Windows — 탐색기 주소", value = "\\\\samba.m00nny.kr\\{user}", tr = { en = "Windows — Explorer address" } },
  { label = "macOS · Linux · 그 밖", value = "smb://samba.m00nny.kr:38445/{user}", tr = { en = "macOS · Linux · others" } },
]

[[app]]
id = "agents"
title = "에이전트"
icon = "🤖"
description = "내 API 키로 돌리는 에이전트 팀과 샌드박스"
