    [[app.widget.param]]
    id = "calendar"
    label = "캘린더"
    from = { path = "/calendar/api/v1/calendars", list = "calendars", value = "id", label = "name" }
    all = "모든 캘린더"
    tr.en = { label = "Calendar", all = "All calendars" }
  [[app.widget]]
  id = "month"
  title = "이번 달"
  description = "한 달을 한눈에 — 날마다 얼마나 찼는지, 고른 날의 일정 — 큰 칸"
  module = "/apps/site/widgets/calendar.js"
  size = "2x2"
  tr.en = { title = "This month", description = "The month at a glance — how full each day is, the events of the day you pick — a big cell" }
    [[app.widget.param]]
    id = "calendar"
    label = "캘린더"
    from = { path = "/calendar/api/v1/calendars", list = "calendars", value = "id", label = "name" }
    all = "모든 캘린더"
    tr.en = { label = "Calendar", all = "All calendars" }
  [[app.widget]]
  id = "tasks"
  title = "할 일"
  description = "체크리스트 — 마감별로 묶고 얼마나 끝냈는지, 홈에서 바로 적고 체크"
  module = "/apps/site/widgets/calendar.js"
  tr.en = { title = "Tasks", description = "A checklist — grouped by when it is due, how much is done, written and ticked on the main page" }
  [[app.route]]
  path = "/calendar/api/"
  limit = "api"
  burst = 40
  body = "64k"
  signin = false
  note = "the calendars' JSON API (portal/calendar.py): a 401 is answered as JSON, not sent to the sign-in page"
  [[app.route]]
  path = "/calendar/feed/"
  auth = "public"
  limit = "api"
  burst = 20
  note = "the ICS subscription feeds: the address is the key, for a phone's calendar"
  [[app.route]]
  path = "/calendar/dav/"
  auth = "public"
  signin = false
  limit = "api"
  burst = 40
  body = "2m"
  note = "CalDAV (RFC 4791 subset, portal/calendar.py): a phone's or a desktop's calendar app reads and writes with a device password (Basic); the service answers its own 401"
  [[app.route]]
  path = "/.well-known/caldav"
  match = "exact"
  auth = "public"
  nginx = "return 301 /calendar/dav/;"
  note = "CalDAV discovery (RFC 6764): a client given only the host finds the service here"

