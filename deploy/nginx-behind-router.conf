# /etc/nginx/sites-available/refhandbook — when a router in front terminates TLS and forwards plain
# HTTP to this nginx. nginx takes the client address from the router's X-Forwarded-For (realip), so
# the rate limits below and the server's sign-in lockout both see the real client, and the server
# needs no RHB_TRUSTED_PROXIES change.
limit_req_zone $binary_remote_addr zone=rhb_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rhb_oauth:10m rate=30r/m;

server {
    listen 80;                       # no TLS here, and no redirect to https: the router already did it
    server_name hb.example.org;

    set_real_ip_from 192.168.0.1;    # the router's LAN address; only it may name the client
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;                       # the public domain, as the router sent it
    proxy_set_header X-Forwarded-For $remote_addr;     # the real client, after realip
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /login     { limit_req zone=rhb_login burst=5 nodelay;  proxy_pass http://127.0.0.1:8765; }
    location = /register  { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /authorize { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /token     { limit_req zone=rhb_oauth burst=20 nodelay; proxy_pass http://127.0.0.1:8765; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
