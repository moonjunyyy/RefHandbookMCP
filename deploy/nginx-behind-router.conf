# /etc/nginx/sites-available/refhandbook — when a router in front terminates TLS and forwards plain
# For one site with a shared Kerberos sign-in, WebDAV and the account portal (RHB_AUTH=sso),
# use ldap-portal/deploy/site/www.m00nny.kr.conf instead.
# HTTP to this nginx. nginx takes the client address from the router's X-Forwarded-For (realip), so
# the rate limits below and the server's sign-in lockout both see the real client, and the server
# needs no RHB_TRUSTED_PROXIES change.
limit_req_zone $binary_remote_addr zone=rhb_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rhb_oauth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rhb_portal:10m rate=10r/m;

server {
    listen 80;                       # no TLS here, and no redirect to https: the router already did it
    server_name hb.example.org;

    set_real_ip_from 192.168.0.1;    # the router's LAN address; only it may name the client
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size 4m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;                       # the public domain, as the router sent it
    proxy_set_header X-Forwarded-For $remote_addr;     # the real client, after realip
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /login     { limit_req zone=rhb_login burst=5 nodelay;  proxy_pass http://127.0.0.1:8765; }
    location = /register  { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /authorize { limit_req zone=rhb_oauth burst=10 nodelay; proxy_pass http://127.0.0.1:8765; }
    location = /token     { limit_req zone=rhb_oauth burst=20 nodelay; proxy_pass http://127.0.0.1:8765; }

    # Account portal (ldap-portal, PORTAL_ROOT_PATH=/account): 사용 신청, password changes, and the
    # admin console. The sign-in page links here when RHB_ACCOUNT_URL=/account. If the portal runs
    # on another host, point proxy_pass there and add this host to its --forwarded-allow-ips.
    # (No proxy_set_header in these blocks: one would drop the server-level Host/X-Forwarded-*.)
    location = /account { return 301 /account/; }
    location /account/ {
        proxy_pass http://127.0.0.1:8080;          # no URI part: /account/... is passed as is
        client_max_body_size 16k;
    }
    location ~ ^/account/(login|request|expired)$ {  # unauthenticated forms
        limit_req zone=rhb_portal burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 16k;
    }
    # Optional: the admin console from the LAN only.
    # location /account/admin/ { allow 192.168.0.0/16; deny all; proxy_pass http://127.0.0.1:8080; }

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
