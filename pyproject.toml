[project]
name = "ldap-portal"
version = "0.1.0"
description = "Self-service and admin portal for OpenLDAP + MIT Kerberos (kldap backend)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "ldap3>=2.9",
    "pexpect>=4.9",
    "pyjwt[crypto]>=2.8",  # SSO identity tokens (EdDSA)
]

[project.optional-dependencies]
# Needs libkrb5-dev to build: sudo apt install libkrb5-dev
kerberos = ["gssapi>=1.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["portal"]

[tool.setuptools.package-data]
portal = ["templates/*.html", "static/*"]
