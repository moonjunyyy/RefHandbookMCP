readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=2.3.0,<3",  # MCPServer API (2.x); 3.0 changes auth defaults
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "ldap3>=2.9",
    "pexpect>=4.9",
    "pyjwt[crypto]>=2.8",  # SSO identity tokens (EdDSA)
    "python-pam>=2.1.0",  # remote mode: password check through the system's PAM stack (default)
    "ldap3>=2.9.1",  # remote mode: password check by LDAP bind (RHB_AUTH=ldap)
    "uvicorn>=0.54.0",  # remote mode: HTTP server
]

[project.scripts]
refhandbook = "refhandbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.13.1",  # tests drive the ASGI app directly
]

[project.optional-dependencies]
# Needs libkrb5-dev to build: sudo apt install libkrb5-dev
kerberos = ["gssapi>=1.8"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.hatch.build.targets.wheel]
packages = ["src/refhandbook"]
[tool.setuptools]
packages = ["portal"]

[tool.setuptools.package-data]
portal = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ldap3 2.9.1 (its latest release) imports pyasn1's tagMap/typeMap, which pyasn1 keeps as deprecated
# aliases. Harmless while they exist; the LDAP tests fail loudly if a pyasn1 upgrade removes them.
filterwarnings = ["ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3"]
