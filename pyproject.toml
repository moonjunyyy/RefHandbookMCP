[project]
name = "refhandbookmcp"
version = "0.10.0"
description = "A quick reference handbook for agents, served over MCP (refhandbook), and the site around it: a self-service and admin portal for OpenLDAP + MIT Kerberos (kldap backend), one sign-in, and hosted apps (portal)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # refhandbook
    "mcp>=2.3.0,<3",  # MCPServer API (2.x); 3.0 changes auth defaults
    "python-pam>=2.1.0",  # remote mode: password check through the system's PAM stack (default)
    "ldap3>=2.9.1",  # remote mode: LDAP bind (RHB_AUTH=ldap); the portal's directory access
    "uvicorn>=0.54.0",  # both servers
    "pyjwt[crypto]>=2.15.1",  # the site sign-in's EdDSA tokens (issued by portal.sso, checked by both)
    # portal
    "fastapi>=0.115",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pexpect>=4.9",  # kadmin and kpasswd through a pty
]

[project.optional-dependencies]
# The portal's password checks; needs libkrb5-dev to build: sudo apt install libkrb5-dev
kerberos = ["gssapi>=1.8"]

[project.scripts]
refhandbook = "refhandbook.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.27",  # the portal's tests (starlette's TestClient)
    "httpx2>=2.13.1",  # refhandbook's tests drive the ASGI app directly
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# two packages, one distribution: their templates, static files and seed data come along
packages = ["src/portal", "src/refhandbook"]

[tool.pytest.ini_options]
# tests/portal and tests/refhandbook are packages, so their conftests do not collide: one run does both
testpaths = ["tests"]
# ldap3 2.9.1 (its latest release) imports pyasn1's tagMap/typeMap, which pyasn1 keeps as deprecated
# aliases. Harmless while they exist; the LDAP tests fail loudly if a pyasn1 upgrade removes them.
filterwarnings = ["ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3"]
